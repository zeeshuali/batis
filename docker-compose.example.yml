version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ACTRANSIT_API_KEY: ${ACTRANSIT_API_KEY}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db

  rt-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.run_rt_ingestor"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ACTRANSIT_API_KEY: ${ACTRANSIT_API_KEY}
    depends_on:
      - db

  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: bay_area_transit_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: {}

